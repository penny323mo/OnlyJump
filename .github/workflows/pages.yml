name: Build and publish OnlyJump
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE: 4.7.2-stable
    steps:
      - uses: actions/checkout@v6
      - name: Install official Godot editor and single-threaded Web template
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          base="https://github.com/godotengine/godot-builds/releases/download/$RELEASE"
          curl -fsSL --retry 3 "$base/Godot_v${RELEASE}_linux.x86_64.zip" -o editor.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  editor.zip' | sha256sum -c -
          unzip -q editor.zip
          mv "Godot_v${RELEASE}_linux.x86_64" godot
          chmod +x godot
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          curl -fsSL --retry 3 "$base/Godot_v${RELEASE}_export_templates.tpz" -o templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  templates.tpz' | sha256sum -c -
          templates="$HOME/.local/share/godot/export_templates/4.7.2.stable"
          mkdir -p "$templates"
          unzip -jq templates.tpz templates/version.txt templates/web_nothreads_release.zip -d "$templates"
      - name: Replay mobile controls
        run: node --test tests/touch-controls.cjs
      - name: Export game
        run: scripts/export-web.sh
      - name: Play through the route at fixed physics ticks
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --fixed-fps 60 --quit-after 6500 --script tests/route.gd | tee "$RUNNER_TEMP/ascent.log"
          grep -Fxq 'PASS mobile parkour: 24 landings, instant jump, sprint, orbit, edge hold, recovery' "$RUNNER_TEMP/ascent.log"
          godot --headless --fixed-fps 60 --quit-after 1700 --script tests/stance.gd | tee "$RUNNER_TEMP/stance.log"
          grep -Fxq 'PASS planted soles, connected ankles, one-foot edges, takeoff and moving strides' "$RUNNER_TEMP/stance.log"
          godot --headless --max-fps 60 --quit-after 1000 --script tests/impact.gd | tee "$RUNNER_TEMP/impact.log"
          grep -Fxq 'PASS surface sounds, impact strength, planted landing compression and immediate rebound' "$RUNNER_TEMP/impact.log"
          godot --headless --fixed-fps 60 --quit-after 7500 --script tests/branches.gd 2>&1 | tee "$RUNNER_TEMP/branches.log"
          if grep -q '^ERROR:' "$RUNNER_TEMP/branches.log"; then exit 1; fi
          grep -Fxq 'PASS branches, rotating fan, timed pickups, double-jump stunts, lower recovery and five characters' "$RUNNER_TEMP/branches.log"
          godot --headless --fixed-fps 60 --quit-after 1300 --script tests/turntable.gd | tee "$RUNNER_TEMP/turntable.log"
          grep -Fxq 'PASS turntable walk-on, rotating ride, wooden surround, tangent jumps and landing marks' "$RUNNER_TEMP/turntable.log"
          godot --headless --fixed-fps 60 --quit-after 1800 --script tests/glide-guide.gd | tee "$RUNNER_TEMP/glide-guide.log"
          grep -Fxq 'PASS glide landing guide, midair expiry, steering, settings and unstable footing' "$RUNNER_TEMP/glide-guide.log"
          godot --headless --fixed-fps 60 --quit-after 1600 --script tests/landing_edges.gd | tee "$RUNNER_TEMP/landing-edges.log"
          grep -Fxq 'PASS landing arrows on real box and mesh rims, lower rungs, moving decks and folding steps' "$RUNNER_TEMP/landing-edges.log"
          godot --headless --fixed-fps 60 --quit-after 4500 --script tests/lift.gd | tee "$RUNNER_TEMP/lift.log"
          grep -Fxq 'PASS laundry lift boarding step, dock alignment, timed crossing and lower catch' "$RUNNER_TEMP/lift.log"
          grep -Fxq 'PASS landing guide tracks both lift trips, open step, cycle wrap and a departing miss' "$RUNNER_TEMP/lift.log"
          godot --headless --fixed-fps 60 --quit-after 3200 --script tests/tape_measure.gd | tee "$RUNNER_TEMP/tape.log"
          grep -Fxq 'PASS tape measure trigger, momentum shortcut, safe rewind, retry and lower catch' "$RUNNER_TEMP/tape.log"
          godot --headless --fixed-fps 60 --quit-after 1600 --script tests/toy_track.gd | tee "$RUNNER_TEMP/track.log"
          grep -Fxq 'PASS toy track banks, coasting, braking, manual ramp jump, forecast and selective recovery' "$RUNNER_TEMP/track.log"
          godot --headless --fixed-fps 60 --quit-after 2300 --script tests/pendulum.gd | tee "$RUNNER_TEMP/pendulum.log"
          grep -Fxq 'PASS pendulum boarding, full swing, girder exit, lower catch and clock housing' "$RUNNER_TEMP/pendulum.log"
          godot --headless --fixed-fps 60 --quit-after 1600 --script tests/spirit_level.gd | tee "$RUNNER_TEMP/level.log"
          grep -Fxq 'PASS spirit level loading, running shortcut, late tilt and lower turntable catch' "$RUNNER_TEMP/level.log"
          godot --headless --fixed-fps 60 --quit-after 2400 --script tests/grips.gd | tee "$RUNNER_TEMP/grips.log"
          grep -Fxq 'PASS standing and moving ledge grabs, failed rolls and collapsing support' "$RUNNER_TEMP/grips.log"
          grep -Fxq 'PASS reverse-stick girder recovery, single chance, deliberate drops and out-of-reach misses' "$RUNNER_TEMP/grips.log"
          godot --headless --fixed-fps 60 --quit-after 2600 --script tests/traverse.gd | tee "$RUNNER_TEMP/traverse.log"
          grep -Fxq 'PASS hand-over-hand girder traverse, rim end, reversal, pull-up and drop to the sheet' "$RUNNER_TEMP/traverse.log"
          grep -Fxq 'PASS clear climb space and independent handholds on the travelling basket' "$RUNNER_TEMP/traverse.log"
          godot --headless --fixed-fps 60 --quit-after 1500 --script tests/records.gd | tee "$RUNNER_TEMP/records.log"
          grep -Fxq 'PASS standing height, moving basket, old saves and relaunch' "$RUNNER_TEMP/records.log"
          grep -Fxq 'PASS summit times, independent branch splits, ties, pause and relaunch' "$RUNNER_TEMP/records.log"
          godot --headless --fixed-fps 60 --quit-after 1200 --script tests/interruption.gd | tee "$RUNNER_TEMP/interruption.log"
          grep -Fxq 'PASS mobile interruption holds airborne and moving-platform state until deliberate input' "$RUNNER_TEMP/interruption.log"
          godot --headless --fixed-fps 60 --quit-after 3500 --script tests/camera.gd | tee "$RUNNER_TEMP/camera.log"
          grep -Fxq 'PASS continuous orbit keeps manual heading and a clear view on nine objects' "$RUNNER_TEMP/camera.log"
          grep -Fxq 'PASS pinch zoom changes camera distance, respects obstacles and preserves heading' "$RUNNER_TEMP/camera.log"
          godot --headless --fixed-fps 60 --quit-after 3200 --script tests/grapple.gd | tee "$RUNNER_TEMP/grapple.log"
          grep -Fxq 'PASS awning grapple, one charge, physical landing, blocked shots and pause' "$RUNNER_TEMP/grapple.log"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
