<script>
const el = id => document.getElementById(id);
const canvas = el('canvas');
let send, mode;
const jumpButton = el('jump');
let jumpFlash;
function sendControl(action,...args) {
  if (action==='jump') {
    jumpButton.dataset.pressed='';
    clearTimeout(jumpFlash);
    jumpFlash=setTimeout(()=>delete jumpButton.dataset.pressed,180);
  }
  send?.(action,...args);
}
const releaseContacts = attachControls(sendControl,()=>mode==='playing');
function clearInputs() {
  releaseContacts();
  clearTimeout(jumpFlash);
  delete jumpButton.dataset.pressed;
}
const sizeOptions = Array.from(el('buttonSizes').querySelectorAll('input'));
const sizeKey = 'onlyjump.buttonSize';
function applyButtonSize(value) {
  const option=sizeOptions.find(input=>input.value===value);
  if (!option) return;
  option.checked=true;
  document.body.dataset.buttonSize=value;
}
try { applyButtonSize(localStorage.getItem(sizeKey)); } catch { /* Use the default for this visit. */ }
el('buttonSizes').onchange=e=>{
  applyButtonSize(e.target.value);
  try { localStorage.setItem(sizeKey,e.target.value); } catch { /* Still applies for this visit. */ }
};
function timer(seconds) {
  return [Math.floor(seconds/60), Math.floor(seconds)%60].map(n => String(n).padStart(2,'0')).join(':');
}
function restoreFocus() {
  if (mode === 'playing') canvas.focus({preventScroll:true});
}
const cast = [['courier','天台速遞員'],['bun','菠蘿油俠'],['fish','鹹魚仔'],['cone','雪糕筒工頭'],['dino','短手暴龍']];
const castButtons = cast.map(([id,name],i)=>{
  const button=document.createElement('button'), portrait=document.createElement('span');
  portrait.className='portrait';
  portrait.style.setProperty('--pos',(i*25)+'%');
  button.append(portrait,document.createTextNode(name));
  button.onclick=()=>{send('character',id);el('cast').close()};
  el('castList').append(button);
  return button;
});
let selectedCast;
el('pickCast').onclick=()=>{el('cast').showModal();castButtons[Math.max(0,cast.findIndex(([id])=>id===selectedCast))].focus()};
el('closeCast').onclick=()=>el('cast').close();
el('branch').onclick=()=>{send('branch');restoreFocus()};
function setText(id,value) {
  const node=el(id);
  if(node.textContent!==value)node.textContent=value;
}
function setHidden(id,hidden) {
  const node=el(id);
  if(node.hidden!==hidden)node.hidden=hidden;
}
function setPressed(id,pressed) {
  const node=el(id), value=String(pressed);
  if(node.getAttribute('aria-pressed')!==value)node.setAttribute('aria-pressed',value);
}
const hintBlockers=Array.from(document.querySelectorAll('header .brand,header .actions,.alt-card,#follow,#notice,#pad,#sprint,#jump'));
const clamp=(value,min,max)=>Math.min(max,Math.max(min,value));
const screenRect=(x1,y1,x2,y2)=>({left:x1*innerWidth,top:y1*innerHeight,right:x2*innerWidth,bottom:y2*innerHeight});
function placePickupLabel(bounds,w,h,x,y,blocked) {
  if(w>bounds.width || h>bounds.height)return null;
  const limitX=v=>clamp(v,bounds.left,bounds.right-w);
  const limitY=v=>clamp(v,bounds.top,bounds.bottom-h);
  const left=limitX(x), top=limitY(y), gap=4;
  const clear=(l,t)=>blocked.every(b=>l+w+gap<=b.left || l>=b.right+gap || t+h+gap<=b.top || t>=b.bottom+gap);
  if(clear(left,top))return {left,top};
  // The nearest clear rectangle meets either the desired position, the
  // safe-area boundary, or an edge of a control on each axis.
  const xs=[left], ys=[top];
  for(const b of blocked){
    xs.push(limitX(b.left-w-gap),limitX(b.right+gap));
    ys.push(limitY(b.top-h-gap),limitY(b.bottom+gap));
  }
  let best=null, distance=Infinity;
  for(const l of xs)for(const t of ys){
    const score=(l-x)**2+(t-y)**2;
    if(score<distance && clear(l,t)){best={left:l,top:t};distance=score;}
  }
  return best;
}
window.OnlyJumpUI = {
  clearInputs,
  pickupHint(x,y,name,x1=x,y1=y,x2=x,y2=y,bodyX1,bodyY1,bodyX2,bodyY2) {
    const tag=el('pickupHint');
    if(!name || x<0 || x>1 || y<0 || y>1){
      setHidden('pickupHint',true);setHidden('pickupLine',true);
      return;
    }
    setText('pickupHint','道具 · '+name);
    setHidden('pickupHint',false);
    const bounds=el('pickupLayer').getBoundingClientRect();
    const w=tag.offsetWidth, h=tag.offsetHeight, cx=x*innerWidth, cy=y*innerHeight;
    const item=screenRect(x1,y1,x2,y2);
    const blocked=hintBlockers.map(node=>node.getBoundingClientRect()).filter(b=>b.width && b.height);
    blocked.push(item);
    if(bodyX1!==undefined)blocked.push(screenRect(bodyX1,bodyY1,bodyX2,bodyY2));
    const pos=placePickupLabel(bounds,w,h,cx-w/2,item.top-h-4,blocked);
    if(!pos){setHidden('pickupHint',true);setHidden('pickupLine',true);return;}
    const left=Math.round(pos.left-bounds.left)+'px', top=Math.round(pos.top-bounds.top)+'px';
    if(tag.style.left!==left)tag.style.left=left;
    if(tag.style.top!==top)tag.style.top=top;
    const endX=clamp(cx,pos.left,pos.left+w), endY=clamp(cy,pos.top,pos.top+h);
    const dx=clamp(endX,item.left,item.right)-endX, dy=clamp(endY,item.top,item.bottom)-endY;
    const length=Math.hypot(dx,dy);
    setHidden('pickupLine',length<=8);
    if(length>8){
      const line=el('pickupLine');
      const transform='translate('+Math.round(endX-bounds.left)+'px, '+Math.round(endY-bounds.top)+'px) rotate('+Math.round(Math.atan2(dy,dx)*180/Math.PI)+'deg) scaleX('+Math.round(length)+')';
      if(line.style.transform!==transform)line.style.transform=transform;
    }
  },
  bindGame(callback) {
    send = callback;
    el('pickCast').disabled = el('start').disabled = el('mute').disabled = false;
    el('start-label').textContent = '開始攀登';
  },
  update(next,height,best,ledge,total,sprint,elapsed,falls,jumps,muted,notice,target,follow,routeRing,landingGuide,fork,laundry,character,ability,seconds,armed,finds,charges,itemTotal,hookHint,gripAction) {
    const changed = mode !== next;
    const playing = next === 'playing', intro = next === 'intro', won = next === 'won';
    if(changed){
      mode=document.body.dataset.mode=next;
      el('intro').hidden=el('legend').hidden=!intro;
      el('look').hidden=el('align').hidden=el('pause').hidden=el('hud').hidden=!playing;
      el('touch').hidden=!(playing || next==='paused');
      el('touch').inert=!playing;
      el('overlay').hidden=!(won || next==='paused');
      el('hintOptions').hidden=next!=='paused';
    }
    const powers={double:'二段跳',jet:'噴射器',glide:'滑翔襪'};
    setHidden('power',!ability);
    if(ability==='hook')setText('power','飛爪 · '+hookHint);
    else if(ability)setText('power',powers[ability]+' · '+(armed?'撳跳點火':Math.ceil(seconds)+' 秒')+(ability==='double'?' · 餘 '+charges+' 次':''));
    setHidden('branch',!playing || !fork);
    setText('sectionName',laundry?'天台晾衣場':'失物天台');
    if(character!==selectedCast){
      selectedCast=character;
      cast.forEach(([id,name],i)=>{
        castButtons[i].setAttribute('aria-pressed',String(id===character));
        if(id===character)el('chosenCast').textContent=name;
      });
    }
    setText('nextProp',target?'下一站 · '+target:'');
    if(next==='paused'){
      el('routeRing').checked=routeRing;
      el('landingGuide').checked=landingGuide;
    }
    setPressed('mute',muted);
    setText('soundLabel',muted?'音效關':'音效開');
    setText('height',height.toFixed(1));
    const stageText=ledge+' / '+total;
    if(el('ledge').textContent!==stageText){
      el('ledge').textContent=stageText;
      el('progress').style.width=(ledge/total*100)+'%';
    }
    setText('time',timer(elapsed));
    setPressed('sprint',sprint);
    setText('sprint',sprint?'加速中':'加速');
    setText('jump',playing && gripAction || '跳躍');
    el('jump').toggleAttribute('data-grip',playing && gripAction==='撐上');
    setPressed('follow',follow);
    setText('follow',follow?'追蹤鏡頭 開':'追蹤鏡頭 關');
    setText('notice',notice);
    setHidden('notice',!notice);
    if(won || next==='paused'){
      setText('panelTitle',won?'登上太陽傘':'已暫停');
      setText('report',(won?'抵達天台最高點。':'')+'用時 '+timer(elapsed)+' · '+jumps+' 次起跳 · '+falls+' 次跌落。最高落腳點 '+best.toFixed(1)+' m。執到道具 '+finds+' / '+itemTotal+'。');
      setText('continue',won?'再攀一次 ↗':'繼續攀登 ↗');
      setHidden('reset',won);
    }
    if (changed) {
      if (!playing) clearInputs();
      if (playing) restoreFocus();
      else if (intro) el('start').focus({preventScroll:true});
      else el('continue').focus({preventScroll:true});
    }
  }
};
el('routeRing').onchange=e=>send('route_ring',e.target.checked);
el('landingGuide').onchange=e=>send('landing_guide',e.target.checked);
el('start').onclick=()=>send('start');
el('align').onclick=()=>{send('align');restoreFocus()};
el('follow').onclick=()=>{send('follow');restoreFocus()};
const sprintKey = e=>['Space','Enter'].includes(e.code);
let keyboardSprint=false;
el('sprint').onkeydown=e=>{if(sprintKey(e)){e.preventDefault();if(!e.repeat){keyboardSprint=true;send('sprint',true)}}};
el('sprint').onkeyup=e=>{if(sprintKey(e)){e.preventDefault();keyboardSprint=false;send('sprint',false)}};
el('sprint').onblur=()=>{if(keyboardSprint){keyboardSprint=false;send('sprint',false)}};
el('jump').onclick=e=>{if(e.detail===0 && mode==='playing')sendControl('jump')};
el('pause').onclick=()=>send('pause');
el('mute').onclick=()=>{send('mute');restoreFocus()};
el('continue').onclick=()=>send(mode==='won'?'restart':'pause');
el('reset').onclick=()=>send('restart');
el('menu').onclick=()=>send('menu');
document.addEventListener('visibilitychange',()=>{if(document.hidden && send)send('hide')});
for (const event of ['blur','pagehide','orientationchange']) window.addEventListener(event,()=>{clearInputs();if(send)send('hide')});
document.addEventListener('keydown',e=>{
  if (mode==='paused' && (e.code==='Escape'||e.code==='KeyP') && e.target!==canvas) { e.preventDefault(); send('pause'); }
  else if(mode==='paused' && e.code==='KeyR' && e.target!==canvas) {e.preventDefault();send('restart');}
  else if (e.code==='Tab' && !el('overlay').hidden) {
    const buttons=Array.from(el('overlay').querySelectorAll('button,summary,input[type=checkbox],input[type=radio]:checked,a[href]')).filter(node=>node.getClientRects().length);
    if(e.shiftKey && document.activeElement===buttons[0]){e.preventDefault();buttons.at(-1).focus()}
    else if(!e.shiftKey && document.activeElement===buttons.at(-1)){e.preventDefault();buttons[0].focus()}
  }
});
function failure(message){el('error').hidden=false;el('error').textContent=String(message);el('start-label').textContent='未能載入';}
</script>
<script src="$GODOT_URL" onerror="failure('遊戲引擎載入失敗，請重新整理。')"></script>
<script>
if(typeof Engine!=='undefined'){
  const config=$GODOT_CONFIG;
  config.mainPack=Object.keys(config.fileSizes).find(name=>name.endsWith('.pck'));
  const missing=Engine.getMissingFeatures({threads:false});
  if(missing.length) failure('瀏覽器缺少 '+missing.join(', ')+'。請用支援 WebGL 2 嘅瀏覽器。');
  else new Engine(config).startGame({canvas,onProgress:(loaded,total)=>{
    if(!send && total>0)el('start-label').textContent='載入 '+Math.round(loaded/total*100)+'%';
  }}).catch(failure);
}
</script>
